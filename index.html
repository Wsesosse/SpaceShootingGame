<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Shooter</title>
    <style>
      html, body { margin: 0; width: 100%; min-height: 100%; background: #080b16; }
      body { min-height: 100dvh; display: grid; place-items: center; overflow: hidden; }
      canvas {
        display: block;
        background: #10182d;
        /* Outline does not change the CSS box that Input maps to GameFrame. */
        outline: 2px solid #4ad;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Space Shooter game"></canvas>
    <script type="module" src="./dist/Main.js"></script>
  </body>
</html>
